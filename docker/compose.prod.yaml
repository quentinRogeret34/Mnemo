# Production behind a reverse proxy that terminates HTTPS (Dokploy's Traefik): the php service only listens on port 80
# of the container network, and SERVER_NAME in the environment is the public domain, used for DEFAULT_URI.
x-app: &app
  build:
    context: ..
    target: prod
  restart: unless-stopped
  environment: &app-env
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?}
    APP_ACCESS_ROLE: ROLE_USER
    APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?}
    APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
    DEFAULT_URI: https://${SERVER_NAME:?}
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?}@database:5432/app?serverVersion=18&charset=utf8
    AI_STORE_DSN: pgsql:host=database;port=5432;dbname=app
    AI_STORE_USER: app
    AI_STORE_PASSWORD: ${POSTGRES_PASSWORD:?}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    MCP_CONNECTORS_ENV: ${MCP_CONNECTORS_ENV:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
    OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    OAUTH_GITLAB_CLIENT_ID: ${OAUTH_GITLAB_CLIENT_ID:-}
    OAUTH_GITLAB_CLIENT_SECRET: ${OAUTH_GITLAB_CLIENT_SECRET:-}
    OAUTH_GITLAB_URL: ${OAUTH_GITLAB_URL:-https://gitlab.com}
    OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
    OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  volumes:
    - storage:/app/var/storage
    - repos:/app/var/repos
    - locks:/app/var/lock
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: ":80"
      SYMFONY_TRUSTED_PROXIES: private_ranges
    expose:
      - "80"
    volumes:
      - storage:/app/var/storage
      - repos:/app/var/repos
      - locks:/app/var/lock
      - caddy_data:/data
      - caddy_config:/config

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "async", "--time-limit=3600", "--memory-limit=256M"]
    healthcheck:
      disable: true

  database:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  storage:
  repos:
  locks:
  caddy_data:
  caddy_config:
  database_data:
