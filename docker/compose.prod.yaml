# Production behind a reverse proxy that terminates HTTPS (Dokploy's Traefik): the php service only listens on port 80
# of the container network, and SERVER_NAME in the environment is the public domain, used for DEFAULT_URI.
x-app: &app
  build:
    context: ..
    target: prod
  restart: unless-stopped
  environment: &app-env
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?}
    APP_ACCESS_ROLE: ROLE_USER
    APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?}
    APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
    DEFAULT_URI: https://${SERVER_NAME:?}
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?}@database:5432/app?serverVersion=18&charset=utf8
    AI_STORE_DSN: pgsql:host=database;port=5432;dbname=app
    AI_STORE_USER: app
    AI_STORE_PASSWORD: ${POSTGRES_PASSWORD:?}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    MCP_CONNECTORS_ENV: ${MCP_CONNECTORS_ENV:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
    OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    GITHUB_APP_ID: ${GITHUB_APP_ID:-}
    GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
    GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    OAUTH_GITLAB_CLIENT_ID: ${OAUTH_GITLAB_CLIENT_ID:-}
    OAUTH_GITLAB_CLIENT_SECRET: ${OAUTH_GITLAB_CLIENT_SECRET:-}
    OAUTH_GITLAB_URL: ${OAUTH_GITLAB_URL:-https://gitlab.com}
    OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
    OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mnemo}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    FACTORY_ENABLED: ${FACTORY_ENABLED:-auto}
    FACTORY_CLI_TIMEOUT: ${FACTORY_CLI_TIMEOUT:-300}
  volumes:
    - storage:/app/var/storage
    - repos:/app/var/repos
    - locks:/app/var/lock
    - worktrees:/app/var/worktrees
  depends_on:
    database:
      condition: service_healthy

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--all-or-nothing"]
    healthcheck:
      disable: true

  php:
    <<: *app
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SERVER_NAME: ":8080"
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HOSTS: "^${SERVER_NAME:?}$$"
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - storage:/app/var/storage
      - repos:/app/var/repos
      - locks:/app/var/lock
      - worktrees:/app/var/worktrees
      - caddy_data:/data
      - caddy_config:/config

  worker:
    <<: *app
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "async", "--time-limit=3600", "--memory-limit=256M"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  database:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  storage:
  repos:
  locks:
  worktrees:
  caddy_data:
  caddy_config:
  database_data:
