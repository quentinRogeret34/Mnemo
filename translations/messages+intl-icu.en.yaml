    llm_help: 'Key and models are set in {link}, or by the environment ({env}). Check with {command}.'
    new: 'New connector'
    pr:
        draft: draft
        error: 'Cannot read the pull requests: {error}'
        lede: 'The bot reviews the pull request with the project graph, then posts its comment and the {check} check on GitHub, as on every push.'
        none: 'No open pull request.'
        open: 'Open pull requests'
        review: 'Run the review'
        updated: 'updated {date}'
    prefilled: 'Prefilled for {name}.'
    preset:
        atlassian:
            auth: OAuth
            description: 'Jira tickets (JQL) or Confluence pages, imported as a document.'
            label: 'Jira / Confluence'
            notes:
                - 'Save, then “Connect with OAuth” on the connector page with an account of the Atlassian site.'
                - 'cloudId: the site (example.atlassian.net) or the id given by the getAccessibleAtlassianResources tool.'
                - 'Confluence: getConfluencePage tool (''{"cloudId": "...", "pageId": "..."}''). Check the names with “Test the connection”.'
                - "A site administrator may have to allow the app's domain."
        context7:
            auth: 'None; optional key'
            description: 'Up-to-date documentation of a library (Symfony, Doctrine...), imported as a document.'
            label: Context7
            notes:
                - 'Get libraryId with the resolve-library-id tool (format /org/project).'
                - 'With a key (context7.com/dashboard): add “CONTEXT7_API_KEY: env:CONTEXT7_API_KEY” and the variable in .env.local.'
        deepwiki:
            auth: None
            description: 'Wiki generated for a public GitHub repository, imported as a document.'
            label: DeepWiki
            notes:
                - 'Replace “owner/repo” with the repository, e.g. symfony/ai.'
                - 'Public repositories only, already indexed on deepwiki.com. The wiki can be long.'
                - 'Other tools: read_wiki_structure (page outline), ask_wiki_question.'
        github-api:
            auth: 'Personal access token (read only)'
            description: 'Code graph, docs, commits, pull requests and issues of a repository, linked to the project rules.'
            label: 'GitHub (code and history)'
            notes:
                - 'Replace “owner/repo” and choose the project: its code graph receives the history.'
                - 'Set GITHUB_TOKEN in .env.local and add it to MCP_CONNECTORS_ENV. A public repository is read without a token: empty the headers field.'
                - '“code_graph: true” clones the repository on the server (default branch, or “branch”), builds its graph with graphify without an LLM and imports README, docs/ and agent conventions. The token must read the contents.'
                - 'First pass: the 200 latest commits, 100 pull requests and 100 issues. The next ones only read the delta.'
                - '“learn_reviews: true” sends the reviews of merged pull requests to the LLM; the learnings arrive in To review.'
                - '“review: true” has the bot comment on each pull request (GitHub App installed on the repository): business rules touched, linked decisions, what the diff contradicts. “review_llm: false” drops the LLM reading of the diff, “review_check: "fail"” fails the mnemo/rules check instead of warning.'
        github:
            auth: 'Personal access token'
            description: 'Issues of a repository, imported as a document.'
            label: GitHub
            notes:
                - 'Set GITHUB_MCP_TOKEN in .env.local (token with read access to the repository).'
                - 'Tool name and arguments not checked without a token: use “Test the connection”, then adjust.'
        gitlab-api:
            auth: 'Access token (read_api)'
            description: 'Code graph, docs, commits, merge requests and issues of a GitLab project, linked to the rules.'
            label: 'GitLab (code and history)'
            notes:
                - 'Replace “group/project” with the project path. Self-hosted instance: change the URL to https://gitlab.example.com/api/v4.'
                - 'Set GITLAB_TOKEN in .env.local and add it to MCP_CONNECTORS_ENV.'
                - '“code_graph: true” clones the repository on the server and builds its graph with graphify; the token then needs read_repository.'
                - 'First pass: the 200 latest commits, 100 merge requests and 100 issues. The next ones only read the delta.'
        linear:
            auth: 'Linear API key'
            description: 'Linear tickets and projects.'
            label: Linear
            notes:
                - 'Set LINEAR_API_KEY in .env.local (Settings → Security & access).'
                - 'Or without a key: empty the headers, save, then “Connect with OAuth” on the connector page.'
                - 'Test the connection, then choose the tool to call.'
        mem0:
            auth: 'mem0 API key'
            description: 'Existing mem0 memories, imported as memories without duplicates.'
            label: mem0
            notes:
                - 'Set MEM0_API_KEY in .env.local.'
                - 'One page per import: raise “page” for the next ones. Filter with ''{"filters": {"AND": [{"app_id": "my-app"}]}}''.'
                - 'All memories get the same type; the original mem0 type is not kept.'
        notion:
            auth: OAuth
            description: 'Notion page or database, imported as a document.'
            label: Notion
            notes:
                - 'Save, then “Connect with OAuth” on the connector page and choose the shared pages.'
                - 'Replace the URL with the one of the page or database to import.'
                - 'Other tool: notion-search (''{"query": "..."}''). Check the names with “Test the connection”.'
