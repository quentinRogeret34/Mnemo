        lede: 'Each checked repository becomes a “GitHub (code and history)” connector: the server clones it, builds its code graph and imports its history into the chosen project.'
        new_per_repository: 'One new project per repository'
        new_per_repository_help: '“One new project per repository” creates a project named after each checked repository, or reuses the one that already has it.'
        none: 'No repository visible with this account.'
        private: private
        public: public
        scope: 'Read access to the repositories, private ones included (“repo” scope).'
