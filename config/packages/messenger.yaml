framework:
    messenger:
        failure_transport: failed
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
        routing:
            App\Message\SyncConnector: async
            App\Message\ReviewPullRequest: async
            App\Message\IndexNode: async
            App\Message\ReindexNodes: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
