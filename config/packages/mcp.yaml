mcp:
    servers:
        default:
            name: mnemo
            description: 'Mnemo, the memory of a project for humans and AI agents: code, business documents, business rules and typed memories in one graph.'
            website_url: 'https://github.com/quentinRogeret34/Mnemo'
            # Only the tools of this application, not those of third-party bundles.
            registry: 'App\Mcp\'

            http:
                path: /mcp
                # Only localhost is allowed by default. Add hostnames without ports for remote access.
                # allowed_hosts: ['localhost', 'mcp.example.com']

            # STDIO for local agents: docker compose exec -T php bin/console mcp:server
            transports:
                stdio: true

when@prod:
    mcp:
        servers:
            default:
                http:
                    # The host check guards a local server against DNS rebinding. A deployed server is reached by
                    # its domain and guarded by API keys (APP_ACCESS_ROLE=ROLE_USER) instead.
                    allowed_hosts: false
