security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin:
            memory:
                users:
                    admin: { password: '%env(APP_ADMIN_PASSWORD_HASH)%', roles: ['ROLE_USER', 'ROLE_SUPER_ADMIN'] }
        users:
            entity: { class: App\Entity\User, property: email }
        front:
            chain: { providers: ['admin', 'users'] }
        api_keys:
            entity: { class: App\Entity\ApiKey, property: id }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/(mcp|api)(/|$)
            stateless: true
            provider: api_keys
            access_token:
                token_handler: App\Security\ApiKeyHandler
        main:
            lazy: true
            provider: front
            form_login:
                login_path: login
                check_path: login
                default_target_path: dashboard
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            custom_authenticators:
                - App\Security\OAuth\OAuthAuthenticator
            entry_point: form_login
            access_denied_handler: App\Security\AccessDeniedHandler
            logout:
                path: logout
                enable_csrf: true

    # APP_ACCESS_ROLE is PUBLIC_ACCESS on a local machine and ROLE_USER once the server is shared.
    access_control:
        # Callbacks of the GitHub connection of the connectors: not a sign-in, they need the same access as the connectors.
        - { path: ^/oauth/github/check/(connector|repositories)$, roles: '%env(APP_ACCESS_ROLE)%' }
        - { path: ^/(login|register|pending|logout|oauth/), roles: PUBLIC_ACCESS }
        # Events of the GitHub App: authenticated by their signature, not by a session.
        - { path: ^/webhooks/, roles: PUBLIC_ACCESS }
        # External Swarm Hub endpoints: authenticated per-swarm by SwarmHubAuthenticator.
        - { path: ^/hub/swarms/, roles: PUBLIC_ACCESS }
        # Whatever the access mode, only a super admin manages accounts and groups.
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/, roles: '%env(APP_ACCESS_ROLE)%' }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
